<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="keywords" content="Nourkrin, 盈法關鍵補給錠, 洛克靈" />
    <meta name="description" content="Nourkrin 盈法關鍵補給錠-洛克靈" />
    <title>Nourkrin 盈法關鍵補給錠-洛克靈</title>
    <link rel="shortcut icon" href="./assets/img/fav.ico" />
    <link rel="stylesheet" href="./assets/css/plugins.css" />
    <link rel="stylesheet" href="./assets/css/style.css" />
    <link rel="stylesheet" href="./assets/css/custom.css" />
  </head>

  <body class="onepage">
    <div id="app">
      <nav>
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link scroll fs-16 fs-sm-20" href="#kv2">認識洛克靈</a>
          </li>
          <li class="nav-item">
            <a class="nav-link scroll fs-16 fs-sm-20" href="#clinic"
              >認證診所</a
            >
          </li>
          <li class="nav-item">
            <a class="nav-link scroll fs-16 fs-sm-20" href="#contact"
              >索取資訊</a
            >
          </li>
          <li class="nav-item">
            <a class="nav-link scroll fs-16 fs-sm-20" href="#kv1">TOP</a>
          </li>
        </ul>
      </nav>
      <div class="content-wrapper">
        <section id="kv1">
          <div class="wrapper">
            <div class="container">
              <div class="row">
                <div class="col-md-10 offset-md-1 position-relative">
                  <img
                    class="w-100 d-none d-lg-block"
                    src="./assets/nourkrin/kv1.png"
                    alt="Nourkrin 盈法關鍵補給錠-洛克靈"
                  />
                  <img
                    class="w-100 d-lg-none"
                    src="./assets/nourkrin/kv1-mb.png"
                    alt="Nourkrin 盈法關鍵補給錠-洛克靈"
                  />
                  <div class="phone-video-outline">
                    <div class="inner">
                      <div class="phone-img">
                        <img
                          class="w-100"
                          src="./assets/nourkrin/phone.png"
                          alt=""
                        />
                      </div>
                      <div class="phone-video">
                        <video
                          poster="./assets/nourkrin/video-pic.jpg"
                          playsinline
                          controls
                          muted
                          autoplay
                          preload="none"
                        >
                          <source
                            src="./assets/nourkrin/video.mp4"
                            type="video/mp4"
                          />
                        </video>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>
        <section id="kv2">
          <div class="container">
            <div class="row">
              <div class="col-md-10 offset-md-1">
                <img
                  class="w-100 d-none d-lg-block"
                  src="./assets/nourkrin/kv2.png"
                  alt="Nourkrin 各項國際獎項"
                />
                <img
                  class="w-100 d-lg-none"
                  src="./assets/nourkrin/kv2-mb.png"
                  alt="Nourkrin 各項國際獎項"
                />
              </div>
            </div>
          </div>
        </section>
        <section id="clinic">
          <div class="wrapper">
            <div class="container">
              <div class="row">
                <div class="col-md-10 offset-md-1">
                  <!-- title -->
                  <div
                    class="clinic-header d-flex flex-row justify-content-center align-items-center my-4"
                  >
                    <div class="logo">
                      <img
                        class="w-100"
                        src="./assets/nourkrin/logo.png"
                        alt="Nourkrin logo"
                      />
                    </div>
                    <h2>認證診所</h2>
                  </div>
                  <!-- filter -->
                  <div class="row">
                    <div class="col-12">
                      <div class="clinic-bg rounded-top p-4 pb-10">
                        <div class="row gx-2">
                          <!-- 全部診所 -->
                          <div class="col-12 col-lg-2">
                            <button
                              class="btn btn-ash w-100 mb-2 mb-lg-0"
                              @click="clearFilter"
                            >
                              全部診所
                            </button>
                          </div>
                          <!-- 搜尋診所 -->
                          <div class="col-12 col-lg-4">
                            <div class="form-floating mb-2 mb-lg-0">
                              <input
                                id="textInputExample"
                                type="text"
                                class="form-control"
                                placeholder="搜尋診所"
                                v-model="search"
                              />
                              <label for="textInputExample">搜尋診所</label>
                            </div>
                          </div>
                          <!-- 選擇地區 -->
                          <div class="col-6 col-lg-3">
                            <div class="form-select-wrapper mb-4">
                              <select
                                v-model="filterRegion"
                                @change="updateRegion"
                                class="form-select"
                                aria-label="選擇地區"
                              >
                                <option value="" selected>選擇地區</option>
                                <option v-for="region in regionList">
                                  {{region}}
                                </option>
                              </select>
                            </div>
                          </div>
                          <!-- 選擇縣市 -->
                          <div class="col-6 col-lg-3">
                            <div class="form-select-wrapper mb-4">
                              <select
                                v-model="filterCity"
                                @change="updateCity"
                                class="form-select"
                                aria-label="選擇縣市"
                              >
                                <option value="" selected>選擇縣市</option>
                                <option v-for="city in cityList">
                                  {{city}}
                                </option>
                              </select>
                            </div>
                          </div>
                        </div>
                        <div class="row">
                          <div class="col-12">
                            <template v-if="filteredClinicList.length > 0">
                              <div
                                class="card mb-2"
                                v-for="clinic in filteredClinicList"
                              >
                                <div class="card-body p-3">
                                  <div
                                    class="d-flex justify-content-between flex-column flex-lg-row"
                                  >
                                    <div
                                      class="left d-flex align-items-start flex-column flex-lg-row"
                                    >
                                      <span
                                        class="badge bg-yellow p-2 mb-1 mb-lg-0"
                                        >{{clinic.city}}</span
                                      >
                                      <span
                                        class="px-0 px-lg-2 fs-18 text-black-100"
                                        >{{clinic.name}}</span
                                      >
                                    </div>
                                    <div
                                      class="right d-flex align-items-start flex-column flex-lg-row fs-16 text-black-50"
                                    >
                                      <span class="px-0 px-lg-2"
                                        >{{clinic.address}}</span
                                      >
                                      <span>{{clinic.phone}}</span>
                                    </div>
                                  </div>
                                </div>
                              </div>
                            </template>
                            <template v-else>
                              <p class="text-center my-4">
                                查無資料，請重新搜尋
                              </p>
                            </template>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>
        <section id="contact">
          <div class="wrapper">
            <div class="container">
              <div class="row mb-10">
                <div class="col-md-10 offset-md-1">
                  <div class="clinic-bg rounded-bottom p-4">
                    <div class="row">
                      <!-- Title -->
                      <div class="col-sm-10 offset-sm-1">
                        <div class="contact-header mb-3 mb-sm-10">
                          <h2 class="d-flex flex-row align-items-center my-4">
                            <span>想要</span>
                            <div class="logo">
                              <img
                                class="w-100"
                                src="./assets/nourkrin/logo.png"
                                alt="Nourkrin logo"
                              />
                            </div>
                            <span>認證診所資訊</span>
                          </h2>
                          <p>
                            為了方便購買請留下您想收到的診所區域，<br />我們會將您選定的區域內販售洛克靈的認證診所資訊發送到您的信箱，謝謝～
                          </p>
                        </div>
                      </div>
                      <!-- IP + Form -->
                      <div class="col-sm-10 offset-sm-1">
                        <div class="position-relative">
                          <div class="ip-img">
                            <img
                              class="w-100"
                              src="./assets/nourkrin/product.png"
                              alt="nourkrin product"
                            />
                          </div>
                        </div>
                        <form
                          ref="contactForm"
                          :class="{'contact-form': true, 'was-validated': contact.wasValid}"
                          method="post"
                          action=""
                          novalidate
                          @submit.prevent="handleSendContact"
                        >
                          <div class="form-floating mb-4">
                            <input
                              id="form_name"
                              v-model="contact.name"
                              type="text"
                              name="name"
                              class="form-control"
                              required
                              data-error="Name is required."
                            />
                            <label for="form_name">姓名 *</label>
                          </div>
                          <div class="form-floating mb-4">
                            <input
                              id="form_phone"
                              v-model="contact.phone"
                              type="tel"
                              name="phone"
                              class="form-control"
                              required
                              data-error="Valid phone is required."
                            />
                            <label for="form_phone">電話 *</label>
                          </div>
                          <div class="form-floating mb-4">
                            <input
                              id="form_email"
                              v-model="contact.email"
                              type="email"
                              name="email"
                              class="form-control"
                              required
                              data-error="Valid email is required."
                            />
                            <label for="form_email">Email *</label>
                          </div>
                          <div class="form-floating mb-4">
                            <select
                              v-model="contact.address"
                              class="form-control"
                              aria-label="選擇地區"
                              name="address"
                              required
                            >
                              <option v-for="city in cityList">{{city}}</option>
                            </select>
                            <label for="form_address">診所區域 *</label>
                          </div>
                          <div class="col-12">
                            <div class="form-check mb-4">
                              <input
                                class="form-check-input"
                                type="checkbox"
                                value=""
                                id="invalidCheck"
                                required
                              />
                              <label for="invalidCheck">
                                我願意收到洛克靈的認證診所資訊，並同意洛克靈遵照個資法相關規範處理應用及傳輸個人資訊，洛克靈亦將依據法令保障參與者個人資料安全。
                              </label>
                            </div>
                          </div>
                          <div class="text-center">
                            <input
                              type="submit"
                              class="btn btn-soft-dark btn-send mb-3"
                              :value="contact.loading ? '送出中...' : '確認送出'"
                            />
                          </div>
                        </form>
                        <!-- /form -->
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>
      </div>
    </div>
    <script type="text/javascript" src="./assets/js/email.js"></script>
    <script src="./assets/js/vue.js"></script>
    <script src="./assets/js/plugins.js"></script>
    <script src="./assets/js/theme.js"></script>
    <script src="./assets/js/custom.js"></script>
  </body>
</html>
